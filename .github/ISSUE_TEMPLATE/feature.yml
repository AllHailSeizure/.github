name: Feature request
description: A new capability or a change in behaviour.
labels: [feat]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you want, and where it would show up.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Optional. What this unblocks or what is awkward today.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P1 is high, P2 medium, P3 low. Add the matching label after opening if you want it tracked that way.
      options:
        - P1
        - P2
        - P3
