name: Sync labels

# Manual runs default to a dry run with deletes off. The nightly
# schedule always applies and never deletes (enforced here and in
# tools/sync_labels.py when GITHUB_EVENT_NAME is schedule).
"on":
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan changes without applying them
        type: boolean
        default: true
      allow_deletes:
        description: Also delete labels listed in labels.yml (never deletes hotel-kline-game must-keep labels)
        type: boolean
        default: false
      repos:
        description: Optional comma-separated repo names (default is every owned, non-fork, non-archived repo)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Require LABEL_SYNC_TOKEN
        env:
          LABEL_SYNC_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
        run: |
          if [ -z "$LABEL_SYNC_TOKEN" ]; then
            echo "LABEL_SYNC_TOKEN is not set. Create a fine-grained PAT owned by AllHailSeizure,"
            echo "limited to the owned repositories, with Issues: Read and write, and store it"
            echo "as the LABEL_SYNC_TOKEN repository secret. GITHUB_TOKEN cannot write labels"
            echo "on other repositories."
            exit 1
          fi

      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          ALLOW_DELETES: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_deletes || false }}
          REPOS: ${{ github.event_name == 'workflow_dispatch' && inputs.repos || '' }}
        run: python3 tools/sync_labels.py
